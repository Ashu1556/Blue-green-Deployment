apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-blue
  namespace: registration-app
  labels:
    app: frontend
    version: basic
    deployment: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      deployment: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        deployment: blue
        version: basic
    spec:
      containers:
      - name: frontend-blue
        image: localhost:5000/registration-frontend-blue:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3100
        envFrom:
        - configMapRef:
            name: frontend-blue-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3100
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3100
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-blue
  namespace: registration-app
  labels:
    app: frontend
    version: basic
spec:
  type: ClusterIP
  selector:
    app: frontend
    deployment: blue
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    protocol: TCP
