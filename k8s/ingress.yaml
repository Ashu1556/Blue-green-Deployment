apiVersion: v1
kind: Service
metadata:
  name: frontend-lb
  namespace: registration-app
  labels:
    app: frontend-load-balancer
spec:
  type: ClusterIP
  selector:
    app: frontend
    deployment: blue
  ports:
  - name: http
    port: 80
    targetPort: 3100
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registration-ingress
  namespace: registration-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: registration.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-lb
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5000
  - host: frontend-blue.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-blue
            port:
              number: 3100
  - host: frontend-green.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-green
            port:
              number: 3200
